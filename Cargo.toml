[package]
name = "ariadne-analysis"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Snapshot-scoped machine-code analysis from normalized instruction summaries"
publish = false

[features]
default = ["input", "ir"]
investigation = ["dep:serde", "dep:serde_json", "dep:sha2"]
reports = ["investigation"]
bap = ["reports"]
input = ["bap", "dep:minidump"]
ir = ["reports", "dep:tempfile"]
bench = ["input"]
validation = ["input", "ir"]
property-tests = ["input", "dep:proptest"]
mbt = ["reports", "dep:mirrorrust", "dep:num-bigint"]

[dependencies]
minidump = { version = "=0.26.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.149", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.20.0", optional = true }
mirrorrust = { path = "../MirrorRust", optional = true }
num-bigint = { version = "0.4", optional = true }
proptest = { version = "=1.9.0", default-features = false, features = ["std"], optional = true }

[lib]
name = "ariadne"

[lints.rust]
unsafe_code = "deny"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "frame_structure_oracle"
path = "tests/frame_structure_oracle.rs"
required-features = ["bap"]

