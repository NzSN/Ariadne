[package]
name = "ariadne-analysis"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Snapshot-scoped machine-code analysis from normalized instruction summaries"
publish = false

[features]
default = ["input", "ir"]
investigation = ["dep:serde", "dep:serde_json", "dep:sha2"]
reports = ["investigation"]
bap = ["reports"]
input = ["bap", "dep:minidump"]
ir = ["reports", "dep:tempfile"]
bench = ["input"]
validation = ["input", "ir"]
mbt = ["reports", "dep:mirrorrust", "dep:num-bigint"]

[dependencies]
minidump = { version = "=0.26.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.149", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.20.0", optional = true }
mirrorrust = { path = "../MirrorRust", optional = true }
num-bigint = { version = "0.4", optional = true }

[lib]
name = "ariadne"

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "ariadne-minidump"
path = "src/bin/ariadne-minidump.rs"
required-features = ["input"]

[[bin]]
name = "ariadne-ir"
path = "src/bin/ariadne-ir.rs"
required-features = ["ir"]

[[bin]]
name = "bap-model-case"
path = "src/bin/bap-model-case.rs"
required-features = ["validation"]

[[bin]]
name = "ariadne-bench"
path = "src/bin/ariadne-bench.rs"
required-features = ["bench"]

[[bin]]
name = "bap_minidump"
path = "src/bin/bap_minidump.rs"
required-features = ["bench"]

[[bin]]
name = "compare_schedule"
path = "src/bin/compare_schedule.rs"
required-features = ["bench"]

[[bin]]
name = "investigation"
path = "src/bin/investigation.rs"
required-features = ["bench"]

[[bin]]
name = "real_minidump"
path = "src/bin/real_minidump.rs"
