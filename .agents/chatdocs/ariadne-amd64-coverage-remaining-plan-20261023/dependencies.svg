<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="790" viewBox="0 0 1380 790" role="img" aria-labelledby="plan-title plan-description">
  <title id="plan-title">Remaining AMD64 coverage: proposed stage dependencies</title>
  <desc id="plan-description">P0 baseline and obligations precedes P1 source authority, P2 architectural constraints, P3 legal domains and P4 bindings. P4 feeds P5 instruction families, P6 wider REP and P7 consumers. P5, P6, P7 and parallel native qualification N feed P8 integrated qualification. P6 and P7 synchronize outcome contracts. The diagram presents proposed work, not completed gates.</desc>
  <rect x="0" y="0" width="1380" height="790" fill="#f7fafc"/>
  <text x="30" y="34" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#1b3d57">Proposed promotion dependencies</text>
  <text x="1350" y="34" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#5a6e7f">Published base 08dcab92 · no new qualification</text>

  <g stroke="#58758c" stroke-width="2.4" fill="none">
    <path d="M250 144 H291"/><path d="M525 144 H566"/>
    <path d="M800 144 H841"/><path d="M1075 144 H1116"/>
    <path d="M1240 220 V270 H450 V326"/>
    <path d="M750 270 V326"/><path d="M1050 270 V326"/>
    <path d="M150 480 V550 H1190 V596"/>
    <path d="M450 480 V550"/><path d="M750 480 V550"/><path d="M1050 480 V550"/>
  </g>
  <g fill="#58758c">
    <polygon points="305,144 291,137 291,151"/><polygon points="580,144 566,137 566,151"/>
    <polygon points="855,144 841,137 841,151"/><polygon points="1130,144 1116,137 1116,151"/>
